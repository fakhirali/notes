name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CLOUDFLARE_API_TOKEN to enable deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage static files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 pages deploy dist \
            --project-name fakhirali-notes \
            --branch master
